<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquetipo D/D Yu-Gi-Oh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <!-- Título principal color rojo -->
    <h1 class="text-danger mb-3">Yugioh! Arquetipo D/D</h1>

    <!-- Button Group que cambia el tipo de monstruo mostrado (Monstruos, Mágicas, Trampas) -->
    <div class="d-flex justify-content-center mb-3">
        <div class="btn-group" role="group">
            <input type="checkbox" class="btn-check filter-btn" id="btnMonstruos" autocomplete="off" checked>
            <label class="btn btn-outline-warning" for="btnMonstruos">Monstruos</label>

            <input type="checkbox" class="btn-check filter-btn" id="btnMagicas" autocomplete="off" checked>
            <label class="btn btn-outline-warning" for="btnMagicas">Cartas Mágicas</label>

            <input type="checkbox" class="btn-check filter-btn" id="btnTrampas" autocomplete="off" checked>
            <label class="btn btn-outline-warning" for="btnTrampas">Cartas Trampa</label>
        </div>
    </div>

    <!-- Switch de Bootstrap para activar y desactivar agrupación por sets -->
    <div class="form-check form-switch d-flex justify-content-center mb-5">
        <input class="form-check-input" type="checkbox" role="switch" id="switchSets">
        <label class="form-check-label ms-2 text-info" for="switchSets">Agrupar por Set y año de salida</label>
    </div>

    <!-- Grid donde se inyectarán dinámicamente las tarjetas -->
    <section class="cartas-grid row g-4 container mx-auto">
        <p class="text-center">Cargando arquetipo D/D...</p>
    </section>

    <script src="assets/js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
